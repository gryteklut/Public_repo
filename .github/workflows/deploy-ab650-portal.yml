name: Deploy AB-650 Study Portal

on:
  push:
    branches: [main]
    paths:
      - 'ab-650-portal/**'
      - '.github/workflows/deploy-ab650-portal.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-ab650
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ab-650-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ab-650-portal/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage site under /AB-650
        working-directory: .
        run: |
          mkdir -p site/AB-650
          cp -a ab-650-portal/dist/. site/AB-650/
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta http-equiv="refresh" content="0; url=./AB-650/" />
              <title>Redirecting to AB-650 Study Portal</title>
              <link rel="canonical" href="./AB-650/" />
            </head>
            <body>
              <p>Redirecting to <a href="./AB-650/">AB-650 Study Portal</a>…</p>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
